# Eigener Deploy für kreta-auswandern.de (Firebase-Hosting-Website "kreta-auswandern").
# Läuft nur bei Änderungen unter sites/kreta/ und berührt taxomade.com nicht.
name: Deploy kreta-auswandern.de
'on':
  push:
    branches:
      - main
    paths:
      - 'sites/kreta/**'
      - '.github/workflows/kreta-auswandern-deploy.yml'
  # Täglich neu bauen, damit die Wetterleiste aktuell ist (04:00 UTC = 6 Uhr in Griechenland im Winter)
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx astro build --root sites/kreta
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: homecaptn
          entryPoint: sites/kreta
          firebaseToolsVersion: '15.34.0'
